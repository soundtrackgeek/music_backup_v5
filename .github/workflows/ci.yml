name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      # Same cache as the Release workflow's Windows verify job. Its key ignores
      # the app's own version, so a version bump does not save a new copy.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            Tools/sonic-analyzer
            Tools/clap-worker
            crates/sonic-core
          shared-key: windows-verify

      - name: Install Node dependencies
        run: npm ci

      - name: Run verification gate
        run: npm run check
